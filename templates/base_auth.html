<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sign in{% endblock %} · Interrival</title>
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <link rel="icon" href="{{ url_for('static', filename='images/logo-mark.jpg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Dancing+Script:wght@600;700&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='auth.css') }}" rel="stylesheet">
</head>

<body class="auth-body">
  <main class="auth-shell">
    <section class="brand-panel" aria-label="Interrival">
      <div class="brand-bg" style="background-image:url('{{ url_for('static', filename='images/building.jpg') }}')">
      </div>
      <div class="brand-shade"></div>
      <span class="float-glass g1"></span><span class="float-glass g2"></span><span class="float-glass g3"></span>
      <div class="brand-content">
        <a class="logo" href="{{ url_for('login') }}" aria-label="Interrival Technology Services home">
          <img src="{{ url_for('static', filename='images/logo-full.png') }}"
            alt="Interrival Technology Services India Pvt Ltd - Explore to success">
        </a>
        <h1 class="brand-title">Employee Task &amp; Timesheet <br class="d-none d-lg-inline">Management System</h1>
        <p class="brand-script">Work Smarter. Achieve Bigger.</p>
      </div>
    </section>

    <section class="form-panel">
      <div class="glow glow-a"></div>
      <div class="glow glow-b"></div>
      <div class="glass-card">{% block card %}{% endblock %}</div>
      <p class="legal">© {{ now_year }} Interrival Technology Services India Pvt Ltd</p>
    </section>
  </main>
  <script src="{{ url_for('static', filename='auth.js') }}"></script>
</body>

</html>
